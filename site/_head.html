<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="#07080B">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/landing.css">
  <script>
    (function () {
      // Стари линкове (/#/…) и инсталираното приложение отиват в /app
      if (location.hash.indexOf('#/') === 0) return location.replace('/app' + location.hash);
      if (location.pathname === '/' && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) return location.replace('/app#/home');
      // Тема преди изрисуване: изборът на посетителя, иначе системната
      var th; try { th = localStorage.getItem('profitaxi.siteTheme'); } catch (e) {}
      if (th !== 'light' && th !== 'dark') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', th);
      // Въвеждащ ефект с логото – веднъж на посещение
      var seen; try { seen = sessionStorage.getItem('profitaxi.intro'); } catch (e) {}
      if (!seen && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');
    })();
  </script>
  <script type="module" src="/js/landing.js"></script>
</head>
<body class="site">

  <div class="intro-road"></div>
  <div class="intro-in">

          <linearGradient id="ibeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".75"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></linearGradient>
          <pattern id="ichk" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#fff"/><rect width="7" height="7" fill="#7C3AED"/><rect x="7" y="7" width="7" height="7" fill="#7C3AED"/></pattern>
        </defs>
        <path class="intro-beam" d="M448 288 L700 230 L700 360 Z" fill="url(#ibeam)"/>
        <g class="intro-speed" stroke="#A78BFA" stroke-linecap="round" stroke-width="14"><path d="M-40 236h90"/><path d="M-10 278h60"/><path d="M-60 320h96"/></g>
        <g class="intro-body">
          <rect class="intro-sign" x="262" y="150" width="84" height="34" rx="9" fill="url(#ichk)" stroke="#0B0B0F" stroke-width="5"/>
          <path d="M70 302c0-22 13-38 35-42l58-10 50-52c11-11 26-18 42-18h86c17 0 33 8 44 21l36 45 26 6c20 5 34 22 34 43v20c0 11-9 20-20 20H88c-10 0-18-8-18-18z" fill="url(#icar)"/>
          <path d="M226 246l30-36c5-6 12-9 20-9h38v45z M330 201h20c9 0 17 4 22 11l26 34h-68z" fill="#0B0B0F"/>
          <path d="M150 280h296" stroke="#C98400" stroke-width="5" stroke-linecap="round" opacity=".55"/>
          <path d="M74 278h26c5 0 8 4 7 9l-2 6H72z" fill="#A78BFA"/>
          <path d="M424 266h16c8 0 14 6 14 14v4h-30z" fill="#FFFBEA"/>
        </g>
        <g class="intro-wheel" style="transform-origin:150px 330px"><circle cx="150" cy="330" r="42" fill="#0B0B0F"/><circle cx="150" cy="330" r="22" fill="#fff"/><path d="M150 310v40M130 330h40" stroke="#7C3AED" stroke-width="6"/></g>
        <g class="intro-wheel" style="transform-origin:372px 330px"><circle cx="372" cy="330" r="42" fill="#0B0B0F"/><circle cx="372" cy="330" r="22" fill="#fff"/><path d="M372 310v40M352 330h40" stroke="#7C3AED" stroke-width="6"/></g>
      </svg></div>
    <div class="intro-word"><i style="--i:0">P</i><i style="--i:1">r</i><i style="--i:2">o</i><i style="--i:3">f</i><i style="--i:4">i</i><b style="--i:5">T</b><b style="--i:6">a</b><b style="--i:7">x</b><b style="--i:8">i</b></div>
    <div class="intro-tag">Карай за печалба. Не само за оборот.</div>
  </div>
  <div class="intro-skip">Натисни, за да продължиш</div>
</div>
<div id="site-head"></div>
