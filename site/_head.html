<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="#231F20">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/landing.css">
  <script>
    (function () {
      // Стари линкове (/#/…) и инсталираното приложение отиват в /app
      if (location.hash.indexOf('#/') === 0) return location.replace('/app' + location.hash);
      if (location.pathname === '/' && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) return location.replace('/app#/home');
      // Тема преди изрисуване: изборът на посетителя, иначе темата на телефона
      var t; try { t = localStorage.getItem('profitaxi.siteTheme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0D0C0C' : '#231F20');
    })();
  </script>
  <script defer src="/js/landing.js"></script>
</head>
<body>
<a class="skip" href="#main">Към съдържанието</a>
