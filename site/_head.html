<!doctype html>
<html lang="bg" data-theme="dark" style="color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">
  <meta name="theme-color" content="#07080B">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/landing.css">
  <script>
    (function () {
      // Стари линкове (/#/…) и инсталираното приложение отиват в /app
      if (location.hash.indexOf('#/') === 0) return location.replace('/app' + location.hash);
      if (location.pathname === '/' && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) return location.replace('/app#/home');
      // Сайтът е само в тъмна тема
      document.documentElement.setAttribute('data-theme', 'dark');
      // Въвеждащ ефект с логото – веднъж на посещение
      var seen; try { seen = sessionStorage.getItem('profitaxi.intro'); } catch (e) {}
      if (!seen && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');
    })();
  </script>
  <script type="module" src="/js/landing.js"></script>
</head>
<body class="site">
<div id="intro" aria-hidden="true">
  <div class="intro-in">
    <div class="intro-logo"><span class="intro-ring"></span><img src="/icons/icon-192.png" alt="" width="112" height="112"></div>
    <div class="intro-word"><span><i>Profi</i></span><span><b>Taxi</b></span></div>
    <div class="intro-bar"><i></i></div>
  </div>
</div>
<div id="site-head"></div>
