<!doctype html>
<meta charset="utf-8">
<title>ProfiTaxi – тестове: гласово въвеждане и търсачка</title>
<pre id="out">Running…</pre>
<script src="_harness.js"></script>
<script type="module">
import { parseSpeech, wordsToDigits } from '/js/speech.js';

const P = (t, o) => parseSpeech(t, o);

await group('Числа с думи', () => {
  const W = [
    ['осемдесет', '80'], ['сто и двадесет', '120'], ['сто двадесет и пет', '125'], ['двадесет и пет', '25'],
    ['сто и пет', '105'], ['хиляда двеста', '1200'], ['хиляда и петдесет', '1050'], ['две хиляди и петстотин', '2500'],
    ['три хиляди', '3000'], ['двеста и петдесет', '250'], ['двайсет', '20'], ['деветнайсет', '19'],
    // десетични (стотинки): „дванайсет и петдесет“ = 12,50 (не 62)
    ['дванайсет и петдесет', '12.5'], ['двадесет и петдесет', '20.5'], ['двадесет и пет и петдесет', '25.5'], ['сто и двайсет и петдесет', '120.5'],
    ['три и четиридесет', '3.4'], ['дванайсет петдесет', '12.5'],
  ];
  for (const [w, d] of W) eq(`„${w}“ → ${d}`, wordsToDigits(w), d);
  eq('Текстът около числото остава', wordsToDigits('кеш сто и двадесет, карта осемдесет'), 'кеш 120, карта 80');
  eq('Стотинките не лепят следващата дума', wordsToDigits('кеш дванайсет и петдесет карта пет'), 'кеш 12.5 карта 5');
  eq('„и“ без число остава', wordsToDigits('кеш и карта'), 'кеш и карта');
});

await group('Гласово въвеждане на смяната', () => {
  const r1 = P('кеш 120 евро, автомивка 4, гориво 25');
  eq('„кеш 120 евро, автомивка 4, гориво 25“ – кеш', r1.income, { cash: 120 });
  eq('… автомивка 4', r1.wash, 4);
  eq('… гориво 25', r1.fuel, { amount: 25, qty: 0 });
  eq('„карта осемдесет“', P('карта осемдесет').income, { card: 80 });
  eq('„гориво 40 евро 28 литра“', P('гориво 40 евро 28 литра').fuel, { amount: 40, qty: 28 });
  eq('„кеш сто и двадесет“', P('кеш сто и двадесет').income, { cash: 120 });
  eq('„карта хиляда двеста“', P('карта хиляда двеста').income, { card: 1200 });
  eq('„кеш дванайсет и петдесет“ → 12,50', P('кеш дванайсет и петдесет').income, { cash: 12.5 });
  eq('„кеш двадесет и пет“ → 25', P('кеш двадесет и пет').income, { cash: 25 });
  eq('„кеш 12,50“ → 12,5', P('кеш 12,50').income, { cash: 12.5 });
  eq('„кеш 1 200“ → 1200', P('кеш 1 200').income, { cash: 1200 });
  eq('„кеш 1200 лева карта 300“', P('кеш 1200 лева карта 300').income, { cash: 1200, card: 300 });
  eq('Всички приходи наведнъж', P('кеш 120 карта 80 бакшиш 5 болт 30').income, { cash: 120, card: 80, tips: 5, app: 30 });
  eq('Числото преди думата: „120 кеш“', P('120 кеш').income, { cash: 120 });
  eq('„бакшиш пет, юбер тридесет“', P('бакшиш пет, юбер тридесет').income, { tips: 5, app: 30 });
  const r2 = P('гориво 40 евро 28 литра кеш 120');
  eq('Гориво с литри и кеш заедно', [r2.fuel, r2.income], [{ amount: 40, qty: 28 }, { cash: 120 }]);
  eq('„заредих газ за 30 лева 20 литра“', P('заредих газ за 30 лева 20 литра').fuel, { amount: 30, qty: 20 });
  eq('„паркинг 2“', P('паркинг 2').parking, 2);
  eq('Без числа → нищо', P('здравей как си'), { income: {}, fuel: null, wash: 0, parking: 0, kmStart: 0, kmEnd: 0 });
  eq('Празно → нищо', P(''), { income: {}, fuel: null, wash: 0, parking: 0, kmStart: 0, kmEnd: 0 });
  eq('Само литри без сума → гориво с литри', P('28 литра').fuel, { amount: 0, qty: 28 });
});

await group('Километри с глас', () => {
  const a = P('начален километраж 250 210 краен 250 400', { kmStart: 250000 });
  eq('„начален километраж 250 210 краен 250 400“ (последен км 250 000)', [a.kmStart, a.kmEnd], [250210, 250400]);
  const b = P('начален километраж 250 210 краен 250 400');
  eq('… без последен км', [b.kmStart, b.kmEnd], [250210, 250400]);
  eq('„краен километраж 250 400“', P('краен километраж 250 400', { kmStart: 250000 }).kmEnd, 250400);
  eq('„километри 180“ при начален 250 000 → краен 250 180', P('километри 180', { kmStart: 250000 }).kmEnd, 250180);
  eq('„километраж 250 400“ при начален 250 000 → краен', P('километраж 250 400', { kmStart: 250000 }).kmEnd, 250400);
  eq('„километраж 250 000“ без начален → начален', P('километраж 250 000').kmStart, 250000);
  const c = P('кеш 120 начален 250 210 краен 250 400', { kmStart: 250000 });
  eq('Пари и км заедно', [c.income.cash, c.kmStart, c.kmEnd], [120, 250210, 250400]);
});

await group('Търсачка: собствените числа', async () => {
  const { personal, searchKB } = await import('/js/views/search.js');
  setNow('2026-10-11T20:00'); // неделя
  const data = mk([
    sh('2026-09-20T08:00', '2026-09-20T18:00', { cash: 300 }),
    sh('2026-10-01T08:00', '2026-10-01T12:00', { cash: 80 }),
    sh('2026-10-06T08:00', '2026-10-06T16:00', { cash: 200, card: 50 }, [{ category: 'fuel', amount: 30, qty: 20 }], [1000, 1150]),
    sh('2026-10-10T08:00', '2026-10-10T13:00', { cash: 100 }),
  ]);
  const A = (q) => personal(q, data)?.a;
  // седмица 05–11.10: 250 + 100 − 30 = 320
  eq('„Колко изкарах тази седмица?“', A('Колко изкарах тази седмица?'), 'Тази седмица: 320 € чисто от 2 смени. Приход 350 €, разходи 30 €.');
  eq('„колко изкарах днес“', A('колко изкарах днес'), 'Днес: няма записани смени.');
  eq('„колко часа карах вчера“', A('колко часа карах вчера'), 'Вчера: 5ч 00м зад волана в 1 смяна.');
  eq('„колко гориво този месец“', A('колко гориво този месец'), 'Този месец: гориво 30 € за 20 л, 150 км.');
  // октомври 1–11: приход 430, разходи 30, чисто 400, 17 ч → 23,53 / 25,29
  eq('„колко изкарвам на час“', A('колко изкарвам на час'), 'Този месец: 23,53 € чисто на час (приход 25,29 € на час).');
  eq('„колко изкарах през септември“', A('колко изкарах през септември'), 'септември 2026: 300 € чисто от 1 смяна. Приход 300 €, разходи 0 €.');
  eq('„колко изкарах миналия месец“', A('колко изкарах миналия месец'), 'септември: 300 € чисто от 1 смяна. Приход 300 €, разходи 0 €.');
  eq('„колко изкарах през декември“ → миналата година', A('колко изкарах през декември'), 'декември 2025: няма записани смени.');
  eq('„колко изкарах миналата седмица“ (28.09–04.10)', A('колко изкарах миналата седмица'), 'Миналата седмица: 80 € чисто от 1 смяна. Приход 80 €, разходи 0 €.');
  eq('„колко км направих тази седмица“', A('колко км направих тази седмица'), 'Тази седмица: 150 км в 2 смени.');
  eq('Въпрос „как“ не е за числата', personal('как да сваля ексел', data), null);
  // готовите отговори
  eq('„как да сваля ексел“ → Excel', searchKB('как да сваля ексел')[0]?.q, 'Как да сваля Excel за счетоводителя?');
  eq('„гориво литри“', searchKB('гориво литри')[0]?.q, 'Как да въведа гориво и литри?');
  eq('„смяна парола“', searchKB('смяна парола')[0]?.q, 'Как да сменя паролата?');
  eq('Празен въпрос → нищо', searchKB(''), []);
  eq('Безсмислица → нищо', searchKB('xyzzy qwerty'), []);
});

finish();
</script>
