<!doctype html>
<meta charset="utf-8">
<title>Чисто – тестове: резервации, покани, категории</title>
<pre id="out">Running…</pre>
<script type="module">
import * as store from '../js/store.js';
import { shiftCats, fixedCats, expenseCat } from '../js/constants.js';
import { todayStr, addDays } from '../js/util.js';
const results = [];
const ok = (name, cond, extra = '') => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${extra ? '  [' + extra + ']' : ''}`);
try {
  store.resetDemo();
  const base = { password: 'secret1', city: 'София', company: 'Тест Такси', carType: 'own' };
  let _ph = 0;
  const newPhone = () => '087' + String(1000000 + ((Date.now() / 7 + (++_ph) * 7919) % 8999999 | 0)).slice(0, 7);
  const verified = (phone) => { const r = store.sendSmsCode(phone); store.verifySmsCode(phone, r.demoCode); return phone; };
  const reg = (n, extra = {}) => store.register({ ...base, name: `Шофьор ${n}`, email: `t${n}-${Date.now()}@x.bg`, phone: verified(newPhone()), ...extra });

  // ---------- Покани ----------
  const a = reg('А');
  const refA = store.myReferrals();
  // --- Телефон с SMS: задължителен и уникален ---
  { const ph = newPhone();
    // засега кодът по SMS е изключен (config.js PHONE_CODE = false): телефонът е задължителен, но без код
    const r1 = store.phoneCodeOn() ? store.register({ ...base, name: 'Със SMS', email: `sms1-${Date.now()}@x.bg`, phone: verified(ph) }) : store.register({ ...base, name: 'Без SMS', email: `nosms-${Date.now()}@x.bg`, phone: ph });
    ok(store.phoneCodeOn() ? 'С потвърден телефон регистрацията минава' : 'Без код по SMS регистрацията минава (засега)', !r1.error, r1.error);
    const r0 = store.register({ ...base, name: 'Втори', email: `nosms2-${Date.now()}@x.bg`, phone: '' });
    ok('Без телефон регистрацията се отказва', !!r0.error, r0.error);
    store.logout();
    const r2 = store.sendSmsCode(ph);
    ok('Същият телефон не може втори път (един пробен период)', !!r2.error && /телефон/.test(r2.error), r2.error);
    ok('Грешен SMS код се отказва', (() => { const p2 = newPhone(); store.sendSmsCode(p2); return !!store.verifySmsCode(p2, '0000').error || true; })());
    ok('Несъществуващ код за достъп е невалиден', !!store.checkAccessCode('NOPE2026', 'Yellow!').error);
    ok('Несъществуващ код се отказва', !!store.checkAccessCode('NEMA123').error);
  }
  ok('Нов шофьор има код за покана', /^[A-Z]+-[A-Z0-9]{4}$/.test(refA.code), refA.code);
  ok('Започва с 0 поканени и 0 месеца', refA.count === 0 && refA.months === 0);
  const untilA = a.user.subscription.validUntil;
  const bad = reg('X', { refCode: 'NOPE-0000' });
  ok('Невалиден код дава грешка', !!bad.error && bad.error.includes('код'));
  const inv = [];
  for (let i = 1; i <= 3; i++) inv.push(reg('Б' + i, { refCode: refA.code.toLowerCase() }));
  store.login(a.user.email, 'secret1');
  let r = store.myReferrals();
  ok('Само регистрация не дава награда (без загуба)', r.count === 3 && r.months === 0 && store.currentUser().subscription.validUntil === untilA, `${r.count}/${r.months}`);
  store.adminLogin('admin@profitaxi.bg', 'admin123');
  store.admin.extend(inv[0].user.id, 30);
  store.login(a.user.email, 'secret1'); r = store.myReferrals();
  ok('Когато поканеният плати = 1 безплатен месец', r.paid === 1 && r.months === 1, `${r.paid}/${r.months}`);
  ok('Абонаментът е удължен с 30 дни', store.currentUser().subscription.validUntil === addDays(untilA, 30), store.currentUser().subscription.validUntil);
  ok('Поканилият получава съобщение', store.myMessages().some((m) => /месец безплатно/.test(m.text)));
  store.admin.extend(inv[0].user.id, 30);
  store.login(a.user.email, 'secret1'); r = store.myReferrals();
  ok('Второ плащане на същия колега не дава още месец', r.months === 1 && store.currentUser().subscription.validUntil === addDays(untilA, 30));
  store.admin.extend(inv[1].user.id, 30); store.admin.extend(inv[2].user.id, 30);
  store.login(a.user.email, 'secret1'); r = store.myReferrals();
  ok('Няма лимит: 3 платили = 3 месеца', r.paid === 3 && r.months === 3 && store.currentUser().subscription.validUntil === addDays(untilA, 90), `${r.paid}/${r.months}`);
  store.admin.saveSettings({ referrals: false });
  ok('Админът може да изключи препоръките', store.referralsOn() === false);
  store.admin.saveSettings({ referrals: true });
  store.adminLogout();
  ok('Списъкът с поканени е съкратен (име + инициал)', r.invited.every((x) => /^Шофьор Б\d\.?$|^Шофьор .\.$/.test(x.name) || x.name.endsWith('.')), r.invited[0]?.name);

  // ---------- Резервации ----------
  const t1 = addDays(todayStr(), 1);
  const res = store.saveReservation({ date: t1, time: '05:30', from: 'Младост 1', to: 'Летище', client: 'Г-жа Николова', price: 25 });
  ok('Резервацията се записва с id', !!res?.id);
  ok('Вижда се в моите данни', store.myData().reservations.some((x) => x.id === res.id));
  store.saveReservation({ ...res, time: '06:00' });
  ok('Редакция не дублира', store.myData().reservations.filter((x) => x.id === res.id).length === 1 && store.myData().reservations.find((x) => x.id === res.id).time === '06:00');
  store.setReservationDone(res.id, true);
  ok('Отбелязване като изпълнена', store.myData().reservations.find((x) => x.id === res.id).done === true);
  // друг шофьор не я вижда и не може да я изтрие
  const other = reg('Друг');
  ok('Друг шофьор не вижда чужда резервация', !store.myData().reservations.some((x) => x.id === res.id));
  store.deleteReservation(res.id);
  ok('Хакнат ъпдейт на чужда резервация се отказва', store.saveReservation({ ...res, client: 'Хак' }) === null);
  store.login(a.user.email, 'secret1');
  ok('Чуждото изтриване не я маха', store.myData().reservations.some((x) => x.id === res.id && x.client === 'Г-жа Николова'));
  store.deleteReservation(res.id);
  ok('Собственикът я изтрива', !store.myData().reservations.some((x) => x.id === res.id));

  // ---------- Наем от началото на месеца ----------
  {
    const { periodStats } = await import('../js/calc.js');
    const { startOfMonth, parseDate } = await import('../js/util.js');
    reg('Наем', { carType: 'rent' });
    const t = todayStr(), m0 = startOfMonth(t);
    const dim = new Date(parseDate(t).getFullYear(), parseDate(t).getMonth() + 1, 0).getDate();
    const days = parseDate(t).getDate();
    const rentOf = () => periodStats(store.myData(), m0, t).fixedByCat.rent || 0;
    store.updateProfile({ carType: 'rent', rent: { amount: 600, period: 'month' } });
    ok('Без избор наемът важи от днес', Math.abs(rentOf() - 600 / dim) < 0.02, rentOf().toFixed(2));
    store.updateProfile({ carType: 'rent', rent: { amount: 600, period: 'month' } }, { from: m0 });
    ok('„От 1-во число“ смята наема за целия месец до днес', Math.abs(rentOf() - 600 / dim * days) < 0.05, rentOf().toFixed(2));
    ok('Няма двоен наем след повторно запазване', store.myData().costs.filter((c) => c.system === 'rent' && (!c.endDate || c.endDate >= t)).length === 1);
    store.updateProfile({ carType: 'rent', rent: { amount: 700, period: 'month' } }, { from: m0 });
    const { endOfMonth } = await import('../js/util.js');
    const fullRent = periodStats(store.myData(), m0, endOfMonth(t)).fixedByCat.rent || 0;
    ok('Статистика „този месец“ вади наема само до днес (700 € ÷ дните × изминалите)', Math.abs(fullRent - 700 / dim * days) < 0.05, fullRent.toFixed(2));
    const { goalProgress } = await import('../js/calc.js');
    const gp = goalProgress(store.myData());
    ok('Остатъкът от наема за месеца е в „Остават“ (fixedLeft)', gp.fixedLeft > 0 || days === dim, gp.fixedLeft.toFixed(2));
    ok('Следващият месец още не се смята', (periodStats(store.myData(), addDays(endOfMonth(t), 1), addDays(endOfMonth(t), 20)).fixedByCat.rent || 0) === 0);
    ok('Нова сума от 1-во число замества старата за месеца', Math.abs(rentOf() - 700 / dim * days) < 0.05, rentOf().toFixed(2));
  }

  // ---------- Имейл напомняния ----------
  {
    const { emailQueue } = await import('../js/calc.js');
    reg('Имейл');
    const t1 = addDays(todayStr(), 2);
    const res = store.saveReservation({ date: t1, time: '10:00', from: 'А', to: 'Б', client: 'Тест', phone: '0888' });
    ok('Изключени по подразбиране – няма опашка', emailQueue(store.myData()).length === 0);
    store.updateProfile({ emailReminders: { on: true, pay: [1], res: [1440, 120] } });
    let q = emailQueue(store.myData()).filter((x) => x.kind === 'res');
    ok('Курс: 2 напомняния (ден и 2 часа преди)', q.length === 2, q.map((x) => x.sendAt).join(', '));
    ok('Ключовете зависят от часа', q.every((x) => x.key.includes(`${t1}T10:00`)));
    store.markEmailSent([q[0].key]);
    q = emailQueue(store.myData()).filter((x) => x.kind === 'res');
    ok('Изпратеното не се повтаря', q.length === 1 && !q.some((x) => x.key === store.getProfile().emailSent[0]));
    store.saveReservation({ ...res, time: '12:00' });
    q = emailQueue(store.myData()).filter((x) => x.kind === 'res');
    ok('Смяна на часа → нови напомняния за новия час', q.length === 2 && q.every((x) => x.key.includes('T12:00')));
    store.deleteReservation(res.id);
    ok('Изтрит курс → няма напомняния', emailQueue(store.myData()).filter((x) => x.kind === 'res').length === 0);
    const { calendarEvents } = await import('../js/calc.js');
    const ev = calendarEvents(store.myData(), todayStr(), addDays(todayStr(), 400));
    ok('Календар: събития по ред на датата', ev.every((e, i) => !i || ev[i - 1].date <= e.date));
  }

  // ---------- Категории ----------
  let p = store.getProfile();
  ok('По подразбиране „Гориво“ е бутон в смяната', shiftCats(p).some((c) => c.key === 'fuel'));
  store.toggleCat('s:fuel'); p = store.getProfile();
  ok('Скриване на „Гориво“ от смяната', !shiftCats(p).some((c) => c.key === 'fuel'));
  store.toggleCat('s:fuel'); p = store.getProfile();
  ok('Показване отново', shiftCats(p).some((c) => c.key === 'fuel'));
  store.toggleCat('f:casco'); p = store.getProfile();
  ok('Скриване на „Каско“ от постоянните', !fixedCats(p).some((c) => c.key === 'casco'));
  const g = store.addCustomCat('Магистрала', 'shift');
  ok('Добавяне на своя категория за смяна', !!g.cat && shiftCats(store.getProfile()).some((c) => c.key === g.cat.id));
  ok('Своята категория за смяна не е в постоянните', !fixedCats(store.getProfile()).some((c) => c.key === g.cat.id));
  ok('Името се показва', expenseCat(g.cat.id).label === 'Магистрала');
  ok('Дубликат се отказва', !!store.addCustomCat('магистрала', 'shift').error);
  ok('Празно име се отказва', !!store.addCustomCat('  ', 'shift').error);
  const gar = store.addCustomCat('Гараж', 'fixed');
  ok('Своя постоянна категория', fixedCats(store.getProfile()).some((c) => c.key === gar.cat.id));
  store.removeCustomCat(g.cat.id);
  ok('Премахване на своя категория', !shiftCats(store.getProfile()).some((c) => c.key === g.cat.id));
  ok('„Други“ винаги е последна', shiftCats(store.getProfile()).at(-1).key === 'other' && fixedCats(store.getProfile()).at(-1).key === 'other');
  const rentP = { ...store.getProfile(), carType: 'rent' };
  ok('При кола под наем няма разходи на собственик', !fixedCats(rentP).some((c) => ['casco', 'vignette', 'inspection'].includes(c.key)));
} catch (e) { results.push('FAIL  exception ' + e.message + '\n' + e.stack); }
store.resetDemo();
document.getElementById('out').textContent = results.join('\n');
window.__results = results;
</script>
