<!doctype html>
<meta charset="utf-8">
<title>Чисто – тестове: изплащане на колата</title>
<pre id="out">Running…</pre>
<script src="_harness.js"></script>
<script type="module">
import { carStats, carLog } from '/js/views/vehicle.js';
import { addDays } from '/js/util.js';

// 10 смени в септември 2026 (1, 3, 5 … 19-ти), 10 ч, кеш 150, гориво 30 → печалба 120
const odd = (month = '2026-09') => Array.from({ length: 10 }, (_, i) => { const d = String(1 + 2 * i).padStart(2, '0'); return sh(`${month}-${d}T08:00`, `${month}-${d}T18:00`, { cash: 150 }, [{ category: 'fuel', amount: 30, qty: 20 }], [0, 200]); });
const leasing = () => cost(300, 'month', '2026-01-01', { category: 'leasing', name: 'Лизинг' });
const inv = (price, date, extra = {}) => ({ investment: { price, date, km: null }, ...extra });

await group('Купена на 01.09, днес 30.09, цена 10 000 €', () => {
  setNow('2026-09-30T20:00');
  const c = carStats(mk(odd(), [leasing()], inv(10000, '2026-09-01')));
  // чисто от 01.09: 1500 − 300 гориво − 300 лизинг = 900
  eq('Смята се от датата на покупката', c.from, '2026-09-01');
  near('Избити = 900', c.paid, 900);
  near('Остават = 10 000 − 900 = 9100', c.left, 9100);
  near('Процент = 9%', c.pct, 9);
  ok('Не е изплатена', !c.done);
  // темпо: 30 дни, 10 работни → 90 €/работен ден, 9 €/ч, 10/30 × 7 = 2,33 дни седмично
  near('На работен ден = 900 / 10 = 90', c.perWorkDay, 90);
  near('На час = 900 / 100 = 9', c.perHour, 9);
  near('Дни седмично = 10 / 30 × 7 = 2,333', c.workDaysPerWeek, 7 / 3);
  ok('Достатъчно данни', c.enoughData);
  eq('Работни дни = ⌈9100 / 90⌉ = ⌈101,1⌉ = 102', c.daysLeft, 102);
  eq('Работни часове = ⌈9100 / 9⌉ = ⌈1011,1⌉ = 1012', c.hoursLeft, 1012);
  // 102 работни дни при 2⅓ на седмица = 102 × 3 = 306 календарни дни (точно, без „307“ от закръгляне)
  eq('Изплащане = днес + 102 / (7/3) × 7 = +306 дни', c.payoffDate, addDays('2026-09-30', 306));
  // разходи по колата: гориво 300 + лизинг 300
  near('Разходи по колата = 600', c.carExp, 600);
  eq('Групи: гориво и лизинг', c.groups.map(([l, v]) => [l, Math.round(v)]), [['Гориво', 300], ['Лизинг', 300]]);
  noNaN('Без NaN/Infinity', { paid: c.paid, left: c.left, pct: c.pct, perWorkDay: c.perWorkDay, perHour: c.perHour, workDaysPerWeek: c.workDaysPerWeek, daysLeft: c.daysLeft, hoursLeft: c.hoursLeft });
});

await group('Ремонт от „Колата ми“ намалява избитото', () => {
  setNow('2026-09-30T20:00');
  const repair = cost(200, 'once', '2026-09-10', { category: 'repair', carLog: true, name: 'Ремонт', endDate: '2026-09-10' });
  const c = carStats(mk(odd(), [leasing(), repair], inv(10000, '2026-09-01')));
  near('Избити = 900 − 200 = 700', c.paid, 700);
  near('Остават = 9300', c.left, 9300);
  near('Разходи по колата = 300 + 300 + 200', c.carExp, 800);
  // ремонт преди покупката не се брои
  const before = cost(200, 'once', '2026-08-20', { category: 'repair', carLog: true });
  near('Ремонт преди покупката не се брои', carStats(mk(odd(), [leasing(), before], inv(10000, '2026-09-01'))).paid, 900);
});

await group('Изплатена', () => {
  setNow('2026-09-30T20:00');
  const c = carStats(mk(odd(), [leasing()], inv(800, '2026-09-01')));
  ok('Изплатена', c.done);
  eq('100%, остават 0', [c.pct, c.left], [100, 0]);
  near('Избити = 900 (може и над цената)', c.paid, 900);
  eq('Няма „работни дни до изплащане“', [c.daysLeft, c.hoursLeft, c.payoffDate], [undefined, undefined, undefined]);
  ok('Точно на цената = изплатена', carStats(mk(odd(), [leasing()], inv(900, '2026-09-01'))).done);
});

await group('Малко данни / на загуба', () => {
  setNow('2026-09-30T20:00');
  // 2 смени: 300 − 60 гориво − 300 лизинг = −60
  const c = carStats(mk(odd().slice(0, 2), [leasing()], inv(10000, '2026-09-01')));
  ok('2 смени → „запиши още смени“', !c.enoughData);
  eq('Избити = 0 (не отрицателно)', c.paid, 0);
  near('Остават = 10 000 + 60 загуба', c.left, 10060);
  eq('Процент = 0', c.pct, 0);
  eq('Без дни/часове/дата', [c.daysLeft, c.hoursLeft, c.payoffDate], [undefined, undefined, undefined]);
  // 3 смени, но на загуба: 450 − 90 − лизинг 600 = −240 → няма прогноза
  const c3 = carStats(mk(odd().slice(0, 3), [cost(600, 'month', '2026-01-01', { category: 'leasing' })], inv(10000, '2026-09-01')));
  ok('3 смени на загуба → няма прогноза', !c3.enoughData && c3.daysLeft === undefined);
  noNaN('Без NaN', { paid: c3.paid, left: c3.left, pct: c3.pct, perWorkDay: c3.perWorkDay, perHour: c3.perHour });
});

await group('Покупка днес / в бъдещето / без цена', () => {
  setNow('2026-09-30T20:00');
  const t = carStats(mk(odd(), [], inv(5000, '2026-09-30')));
  eq('Купена днес: 0 избити, остават 5000', [t.paid, t.left, t.pct], [0, 5000, 0]);
  ok('Купена днес: няма прогноза', !t.enoughData && t.daysLeft === undefined);
  const f = carStats(mk(odd(), [leasing()], inv(5000, '2026-12-01')));
  eq('Бъдеща дата: 0 избити, 0%', [f.paid, f.pct], [0, 0]);
  eq('Бъдеща дата: остават цялата цена', f.left, 5000);
  ok('Бъдеща дата: няма прогноза', !f.enoughData);
  noNaN('Бъдеща дата: без NaN', { paid: f.paid, left: f.left, pct: f.pct, perWorkDay: f.perWorkDay, perHour: f.perHour, w: f.workDaysPerWeek });
  const z = carStats(mk(odd(), [], inv(0, '2026-09-01')));
  eq('Цена 0 → няма инвестиция', [z.inv, z.paid], [null, undefined]);
  eq('Без инвестиция: смята от първата смяна', z.from, '2026-09-01');
  const n = carStats(mk(odd(), [], { investment: null }));
  eq('investment null → без сметка за изплащане', [n.inv, n.pct], [null, undefined]);
  const e = carStats(mk([], [], {}));
  eq('Без смени и без покупка: от днес', e.from, '2026-09-30');
  noNaN('Без смени: без NaN', { p: e.perWorkDay, h: e.perHour, w: e.workDaysPerWeek, x: e.carExp });
});

await group('Купена преди повече от 60 дни – темпото е от последните 60', () => {
  setNow('2026-09-30T20:00');
  // юни: 10 смени × 120 = 1200; септември: 10 × 120 = 1200; без постоянни
  const c = carStats(mk([...odd('2026-06'), ...odd()], [], inv(5000, '2026-06-01')));
  near('Избити от 01.06 = 2400', c.paid, 2400);
  near('Остават = 2600', c.left, 2600);
  // темпо 01.08–30.09 (61 дни): 10 работни дни, 1200 €, 100 ч
  near('На работен ден = 120', c.perWorkDay, 120);
  near('На час = 12', c.perHour, 12);
  near('Дни седмично = 10 / 61 × 7 = 1,148', c.workDaysPerWeek, 70 / 61);
  eq('Работни дни = ⌈2600 / 120⌉ = 22', c.daysLeft, 22);
  eq('Часове = ⌈2600 / 12⌉ = 217', c.hoursLeft, 217);
  // 22 работни дни при 70/61 на седмица → 22 × 61 / 10 = 134,2 → 135 календарни дни
  eq('Изплащане = днес + ⌈134,2⌉ = +135 дни', c.payoffDate, addDays('2026-09-30', 135));
});

await group('Работи по-малко от 1 ден седмично – датата на изплащане да не е подценена', () => {
  setNow('2026-09-30T20:00');
  // 3 смени за последните 61 дни (01.08–30.09), по 200 € чисто → 600; 3 / 61 × 7 = 0,344 дни седмично
  const L = ['2026-08-05', '2026-09-02', '2026-09-28'].map((d) => sh(`${d}T08:00`, `${d}T18:00`, { cash: 200 }));
  const c = carStats(mk(L, [], inv(2600, '2026-07-01')));
  near('Избити = 600, остават 2000', c.left, 2000);
  eq('Работни дни = 2000 / 200 = 10', c.daysLeft, 10);
  near('Дни седмично = 3 / 61 × 7 = 0,344', c.workDaysPerWeek, 21 / 61);
  // 10 работни дни при 0,344 на седмица → 10 × 61 / 3 = 203,3 → 204 дни (а не 70, сякаш кара веднъж седмично)
  eq('Изплащане = днес + ⌈203,3⌉ = +204 дни', c.payoffDate, addDays('2026-09-30', 204));
});

await group('Всеки ден на работа – до 7 дни седмично', () => {
  setNow('2026-09-30T20:00');
  const L = Array.from({ length: 30 }, (_, i) => { const d = `2026-09-${String(i + 1).padStart(2, '0')}`; return sh(`${d}T08:00`, `${d}T18:00`, { cash: 100 }); });
  const c = carStats(mk(L, [], inv(30000, '2026-09-01')));
  near('Дни седмично = 7', c.workDaysPerWeek, 7);
  eq('Работни дни = (30000 − 3000) / 100 = 270', c.daysLeft, 270);
  eq('Изплащане = +270 дни', c.payoffDate, addDays('2026-09-30', 270));
});

await group('Дял от разходите при споделена кола', () => {
  setNow('2026-09-30T20:00');
  // лизинг 300 при дял 50% → 150
  const c = carStats(mk(odd(), [leasing()], { ...inv(10000, '2026-09-01'), sharePct: 50 }));
  near('Избити = 1500 − 300 − 150 = 1050', c.paid, 1050);
});

await group('Ремонти по дати (carLog)', () => {
  const L = [sh('2026-09-05T08:00', '2026-09-05T18:00', {}, [{ category: 'repair', amount: 80 }, { category: 'fuel', amount: 30 }, { category: 'tires', amount: 400 }], [1000, 1200])];
  const costs = [cost(150, 'once', '2026-09-20', { category: 'service', carLog: true, name: 'Обслужване', km: 5000 }), cost(300, 'month', '2026-01-01')];
  const log = carLog(mk(L, costs));
  eq('3 записа (ремонт + гуми от смяната + обслужване), без горивото и месечния', log.length, 3);
  eq('Подредени от най-новия', log.map((x) => x.date), ['2026-09-20', '2026-09-05', '2026-09-05']);
  near('Сума = 150 + 80 + 400 = 630', log.reduce((a, x) => a + x.amount, 0), 630);
  eq('Километри от смяната = крайния км', log.find((x) => x.cat === 'repair').km, 1200);
});

finish();
</script>
