<title>ProfiTaxi – тестове: пари, смени, постоянни разходи, периоди</title>
<pre id="out">Running…</pre>
<script src="_harness.js"></script>
<script type="module">
import { shiftIncome, shiftExpenses, shiftProfit, shiftKm, shiftHours, shiftDate, fixedForDay, fixedByCategory, monthlyFixed, costMonthly, activeCosts, periodStats, series, weekStrip, shiftNetAfterFixed, records, timeInsights } from '/js/calc.js';
import { money, money2, moneyFull, fmtNum, fmtNum1, fmtDuration, fmtTimer, parseNum, round2, addDays, daysBetween, startOfWeek, startOfMonth, endOfMonth, daysInMonth, eachDay, isoToDateStr, weekdayIdx, fmtDate, fmtDateLong, parseDate, dateStr, minStr, maxStr } from '/js/util.js';

const NB = ' ';

// =====================================================================
await group('Смяна: приходи, разходи, нето, часове, км', () => {
  // 15.09.2026 08:00–18:30 → 10,5 ч; км 250 000 → 250 210 = 210 км
  // приход: 120,50 + 80,25 + 30 + 5,10 = 235,85
  // разходи: 40,30 + 4 + 2,50 = 46,80   →  печалба 235,85 − 46,80 = 189,05
  const s = sh('2026-09-15T08:00', '2026-09-15T18:30', { cash: 120.5, card: 80.25, app: 30, tips: 5.1 },
    [{ category: 'fuel', amount: 40.3, qty: 28, fuelType: 'petrol' }, { category: 'wash', amount: 4 }, { category: 'parking', amount: 2.5 }], [250000, 250210]);
  near('Приход = кеш+карта+прил.+бакшиш = 235,85', shiftIncome(s), 235.85);
  near('Разходи по смяната = 46,80', shiftExpenses(s), 46.8);
  near('Печалба от смяната = 189,05', shiftProfit(s), 189.05);
  near('Часове = 10,5', shiftHours(s), 10.5);
  eq('Километри = 210', shiftKm(s), 210);
  eq('Датата на смяната = 2026-09-15', shiftDate(s), '2026-09-15');
  // на час / на км през periodStats (без постоянни разходи): 189,05/10,5 = 18,0048; 189,05/210 = 0,90024
  setNow('2030-01-01T12:00');
  const st = periodStats(mk([s]), '2026-09-15', '2026-09-15');
  near('Чисто на час = 189,05 / 10,5 = 18,0048', st.netPerHour, 189.05 / 10.5);
  near('Чисто на км = 189,05 / 210 = 0,9002', st.netPerKm, 189.05 / 210);
  near('Приход на час = 235,85 / 10,5 = 22,4619', st.incomePerHour, 235.85 / 10.5);
  near('Приход на км = 235,85 / 210 = 1,1231', st.incomePerKm, 235.85 / 210);
  near('Разход на км = 46,80 / 210 = 0,2229', st.costPerKm, 46.8 / 210);
  near('Гориво на 100 км = 28 / 210 × 100 = 13,333 л', st.fuel.petrol.per100, 28 / 210 * 100);

  // липсващи полета на прихода (стари записи): не трябва да става NaN
  const old = { start: s.start, end: s.end, income: { cash: 50 }, expenses: [{ category: 'fuel', amount: '12.5' }, { category: 'wash' }] };
  near('Липсваща карта/прил./бакшиш се броят за 0', shiftIncome(old), 50);
  near('Сума като текст „12.5“ и без сума → 12,5', shiftExpenses(old), 12.5);

  // отрицателна печалба: приход 20, гориво 50 → −30
  const neg = sh('2026-09-16T08:00', '2026-09-16T10:00', { cash: 20 }, [{ category: 'fuel', amount: 50 }]);
  near('Отрицателна печалба = −30', shiftProfit(neg), -30);
  const stn = periodStats(mk([neg]), '2026-09-16', '2026-09-16');
  near('Отрицателно чисто на час = −30 / 2 = −15', stn.netPerHour, -15);
  eq('Без км: чисто на км = 0 (не Infinity/NaN)', stn.netPerKm, 0);

  // нулева смяна: 0 часа, 0 км
  const zero = sh('2026-09-17T08:00', '2026-09-17T08:00', { cash: 10 });
  eq('0 часа', shiftHours(zero), 0);
  const stz = periodStats(mk([zero]), '2026-09-17', '2026-09-17');
  eq('0 часа: на час = 0', stz.netPerHour, 0);
  eq('0 км: на км = 0', stz.netPerKm, 0);
  noNaN('0 часа и 0 км: никъде NaN/Infinity', stz);
  // край преди начало (грешно въведено) → 0 часа, не отрицателни
  eq('Край преди началото → 0 часа', shiftHours(sh('2026-09-17T10:00', '2026-09-17T08:00')), 0);
  // краен км 0 (още не е въведен) → 0 км, не −250 000
  eq('Краен км 0 → 0 км, не отрицателни', shiftKm(sh('2026-09-17T10:00', null, {}, [], [250000, 0])), 0);
  eq('Без км полета → 0', shiftKm({}), 0);
});

// =====================================================================
await group('Смяна през полунощ и смяна на часовото време (Europe/Sofia)', () => {
  // проверка, че браузърът е в часовата зона на България – иначе тестовете за лятно време нямат смисъл
  ok('Часова зона Europe/Sofia', Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Sofia', Intl.DateTimeFormat().resolvedOptions().timeZone);
  const night = sh('2026-09-10T20:00', '2026-09-11T06:30', { cash: 100 });
  near('Нощна смяна 20:00 → 06:30 = 10,5 ч', shiftHours(night), 10.5);
  eq('Нощна смяна е в деня на тръгване', shiftDate(night), '2026-09-10');
  // 29.03.2026 (последна неделя на март): 03:00 → 04:00, т.е. нощта е с 1 час по-къса
  // 28.03 22:00 (UTC+2) → 29.03 06:00 (UTC+3) = 7 реални часа
  const spring = sh('2026-03-28T22:00', '2026-03-29T06:00', { cash: 70 });
  near('Лятно часово време: 22:00 → 06:00 = 7 реални часа', shiftHours(spring), 7);
  eq('… и е в деня на тръгване (28.03)', shiftDate(spring), '2026-03-28');
  // 25.10.2026: 04:00 → 03:00, нощта е с 1 час по-дълга: 22:00 → 06:00 = 9 часа
  const fall = sh('2026-10-24T22:00', '2026-10-25T06:00', { cash: 90 });
  near('Зимно часово време: 22:00 → 06:00 = 9 реални часа', shiftHours(fall), 9);
  // 25.10 02:30 (UTC+3) → 05:30 (UTC+2) = 4 часа
  near('Зимно време: 02:30 → 05:30 на 25.10 = 4 часа', shiftHours(sh('2026-10-25T02:30', '2026-10-25T05:30')), 4);
  setNow('2030-01-01T12:00');
  const st = periodStats(mk([spring]), '2026-03-28', '2026-03-29');
  near('На час в нощта на смяната: 70 / 7 = 10', st.netPerHour, 10);
  eq('Една смяна, един работен ден', [st.shifts, st.workedDays], [1, 1]);
  // дати около смяната на часа – без прескачане или повтаряне на ден
  eq('eachDay през 29.03 – 3 дни', eachDay('2026-03-28', '2026-03-30'), ['2026-03-28', '2026-03-29', '2026-03-30']);
  eq('eachDay през 25.10 – 3 дни', eachDay('2026-10-24', '2026-10-26'), ['2026-10-24', '2026-10-25', '2026-10-26']);
  eq('Дни между 1 март и 1 април = 31 (въпреки лятното часово време)', daysBetween('2026-03-01', '2026-04-01'), 31);
  eq('Дни между 1 окт и 1 ное = 31', daysBetween('2026-10-01', '2026-11-01'), 31);
  eq('Март 2026 има 31 дни в eachDay', eachDay('2026-03-01', '2026-03-31').length, 31);
  eq('Октомври 2026 има 31 дни в eachDay', eachDay('2026-10-01', '2026-10-31').length, 31);
});

// =====================================================================
await group('Активна смяна (без край)', () => {
  setNow('2026-09-15T11:00');
  const act = sh('2026-09-15T08:00', null, { cash: 40 });
  near('Активна смяна от 08:00, сега 11:00 → 3 ч', shiftHours(act), 3);
  const st = periodStats(mk([act]), '2026-09-15', '2026-09-15');
  eq('Активната смяна не влиза в статистиката', [st.shifts, st.income, st.hours], [0, 0, 0]);
  eq('Активната смяна не е работен ден', st.workedDays, 0);
  const done = sh('2026-09-15T00:30', '2026-09-15T06:00', { cash: 60 });
  const data = mk([act, done], [cost(70, 'week', '2026-01-01')]);
  // делът от постоянните за деня се дели само между приключените смени: 10 €/ден ÷ 1
  near('Нето на смяна след постоянните: 60 − 10 = 50 (активната не се брои)', shiftNetAfterFixed(data, done), 50);
});

// =====================================================================
await group('Постоянни разходи по дни', () => {
  const P = { sharePct: 100 };
  const f = (c, day, worked = false) => fixedForDay([c], P, day, worked);
  const sum = (c, from, to, workedSet = new Set()) => eachDay(from, to).reduce((a, d) => a + fixedForDay([c], P, d, workedSet.has(d)), 0);
  // месечен: сумата се дели на дните в месеца
  near('Месечен 300 € във февруари 2026 (28 д.) = 10,7143 €/ден', f(cost(300, 'month', '2026-01-01'), '2026-02-10'), 300 / 28);
  near('Месечен 300 € – общо за февруари 2026 = 300', sum(cost(300, 'month', '2026-01-01'), '2026-02-01', '2026-02-28'), 300);
  near('Месечен 290 € във февруари 2028 (високосна, 29 д.) = 10 €/ден', f(cost(290, 'month', '2026-01-01'), '2028-02-29'), 10);
  near('Месечен 290 € – общо за февруари 2028 = 290', sum(cost(290, 'month', '2026-01-01'), '2028-02-01', '2028-02-29'), 290);
  near('Месечен 300 € в април (30 д.) = 10 €/ден', f(cost(300, 'month', '2026-01-01'), '2026-04-15'), 10);
  near('Месечен 310 € в октомври (31 д.) = 10 €/ден', f(cost(310, 'month', '2026-01-01'), '2026-10-31'), 10);
  near('Месечен 310 € – общо за октомври = 310', sum(cost(310, 'month', '2026-01-01'), '2026-10-01', '2026-10-31'), 310);
  // от средата на месеца: 300 € в септември, от 16-ти → 15 дни × 10 = 150
  near('Месечен 300 € от 16 септ. → 150 € за септември', sum(cost(300, 'month', '2026-09-16'), '2026-09-01', '2026-09-30'), 150);
  eq('… 15 септ. (преди началото) = 0', f(cost(300, 'month', '2026-09-16'), '2026-09-15'), 0);
  near('… 16 септ. (първият ден) = 10', f(cost(300, 'month', '2026-09-16'), '2026-09-16'), 10);
  // прекратен: до 10 септ. включително → 10 × 10 = 100
  const ended = cost(300, 'month', '2026-01-01', { endDate: '2026-09-10' });
  near('Месечен 300 €, спрян след 10 септ. → 100 € за септември', sum(ended, '2026-09-01', '2026-09-30'), 100);
  near('… крайният ден още се брои', f(ended, '2026-09-10'), 10);
  eq('… денят след крайния = 0', f(ended, '2026-09-11'), 0);
  // седмичен: 70/7 = 10 на ден, 30 дни → 300
  near('Седмичен 70 € = 10 €/ден', f(cost(70, 'week', '2026-01-01'), '2026-09-15'), 10);
  near('Седмичен 70 € – общо за септември = 300', sum(cost(70, 'week', '2026-01-01'), '2026-09-01', '2026-09-30'), 300);
  near('Седмичен 70 € – точно една седмица (пн–нд) = 70', sum(cost(70, 'week', '2026-01-01'), '2026-09-07', '2026-09-13'), 70);
  // тримесечен: 365 × 4 / 365 = 4 на ден; септември → 120
  near('Тримесечен 365 € = 4 €/ден (2026)', f(cost(365, 'quarter', '2026-01-01'), '2026-09-15'), 4);
  near('Тримесечен 365 € – общо за септември = 120', sum(cost(365, 'quarter', '2026-01-01'), '2026-09-01', '2026-09-30'), 120);
  near('Тримесечен 120 € – цяла 2026 = 480', sum(cost(120, 'quarter', '2026-01-01'), '2026-01-01', '2026-12-31'), 480);
  // годишен: 365/365 = 1 на ден; високосна 2028: 366/366 = 1
  near('Годишен 365 € = 1 €/ден (2026)', f(cost(365, 'year', '2020-01-01'), '2026-06-01'), 1);
  near('Годишен 366 € = 1 €/ден (2028, високосна)', f(cost(366, 'year', '2020-01-01'), '2028-06-01'), 1);
  near('Годишен 730 € – цяла 2028 = 730', sum(cost(730, 'year', '2020-01-01'), '2028-01-01', '2028-12-31'), 730);
  near('Годишен 97 € – цяла 2027 = 97', sum(cost(97, 'year', '2020-01-01'), '2027-01-01', '2027-12-31'), 97);
  // на ден: всеки ден / само в работни дни
  near('На ден 5 € – всеки ден', f(cost(5, 'day', '2026-01-01'), '2026-09-15'), 5);
  near('Ефир 10 € на работен ден – работен', f(cost(10, 'day', '2026-01-01', { perWorkDay: true }), '2026-09-15', true), 10);
  eq('Ефир 10 € на работен ден – почивен = 0', f(cost(10, 'day', '2026-01-01', { perWorkDay: true }), '2026-09-15', false), 0);
  // еднократен (ремонт): само в деня си; withOnce=false го пропуска
  const once = cost(200, 'once', '2026-09-20', { category: 'repair' });
  near('Еднократен 200 € – в деня си', f(once, '2026-09-20'), 200);
  eq('Еднократен – в друг ден = 0', f(once, '2026-09-21'), 0);
  eq('Еднократен – пропуска се с withOnce=false', fixedForDay([once], P, '2026-09-20', true, false), 0);
  near('Еднократен – веднъж за месеца', sum(once, '2026-09-01', '2026-09-30'), 200);
  // дял на шофьора при споделена кола: само разходите „за колата“
  near('Наем 140 €/седм при дял 50% = 10 €/ден', fixedForDay([cost(140, 'week', '2026-01-01', { category: 'rent' })], { sharePct: 50 }, '2026-09-15', false), 10);
  near('Данъци 300 €/мес при дял 50% – не се делят = 10 €/ден', fixedForDay([cost(300, 'month', '2026-01-01', { category: 'taxes' })], { sharePct: 50 }, '2026-09-15', false), 10);
  near('Без sharePct в профила → 100%', fixedForDay([cost(140, 'week', '2026-01-01', { category: 'rent' })], {}, '2026-09-15', false), 20);
  // няколко разхода заедно в един ден: 10 (седм.) + 10 (ефир, работен) + 4 (трим.) + 1 (год.) = 25
  const many = [cost(70, 'week', '2026-01-01'), cost(10, 'day', '2026-01-01', { perWorkDay: true }), cost(365, 'quarter', '2026-01-01'), cost(365, 'year', '2026-01-01')];
  near('Сбор на няколко разхода в работен ден = 25', fixedForDay(many, P, '2026-09-15', true), 25);
  near('… в почивен ден = 15', fixedForDay(many, P, '2026-09-15', false), 15);
  // по категории
  const byCat = fixedByCategory([cost(70, 'week', '2026-01-01', { category: 'rent' }), cost(10, 'day', '2026-01-01', { perWorkDay: true, category: 'dispatch' })], P, eachDay('2026-09-07', '2026-09-13'), new Set(['2026-09-08', '2026-09-09']));
  near('По категории: наем за седмица = 70', byCat.rent, 70);
  near('По категории: ефир 2 работни дни = 20', byCat.dispatch, 20);
  // месечна стойност на разходите (за екрана „Постоянни разходи“)
  setNow('2026-09-15T12:00');
  near('Месечно: ефир 10 € × 24 работни дни = 240', monthlyFixed([cost(10, 'day', '2026-01-01', { perWorkDay: true })], P), 240);
  near('Месечно: всеки ден 5 € × 30,44 = 152,2', monthlyFixed([cost(5, 'day', '2026-01-01')], P), 152.2);
  near('Месечно: седмичен 140 € = 140 × 52,1775 / 12 = 608,74', monthlyFixed([cost(140, 'week', '2026-01-01')], P), 140 * 52.1775 / 12);
  near('Месечно: тримесечен 120 € = 40', monthlyFixed([cost(120, 'quarter', '2026-01-01')], P), 40);
  near('Месечно: годишен 120 € = 10', monthlyFixed([cost(120, 'year', '2026-01-01')], P), 10);
  near('Месечно: месечен 300 € = 300', costMonthly(cost(300, 'month', '2026-01-01'), P), 300);
  eq('Месечно: прекратеният и еднократният не се броят', monthlyFixed([cost(300, 'month', '2026-01-01', { endDate: '2026-09-01' }), cost(200, 'once', '2026-09-15')], P), 0);
  eq('Активни разходи: без спрените и еднократните', activeCosts([cost(1, 'month', '2026-01-01'), cost(1, 'month', '2026-01-01', { endDate: '2026-09-14' }), cost(1, 'month', '2026-01-01', { endDate: '2026-09-15' }), cost(1, 'once', '2026-09-15')]).length, 2);
});

// =====================================================================
await group('Няколко смени в един ден делят постоянните разходи', () => {
  setNow('2030-01-01T12:00');
  // наем 140 €/седм = 20 €/ден + ефир 10 € на работен ден → 30 € за 15.09
  const A = sh('2026-09-15T06:00', '2026-09-15T12:00', { cash: 100 });            // печалба 100
  const B = sh('2026-09-15T18:00', '2026-09-15T23:00', { cash: 70 }, [{ category: 'fuel', amount: 10 }]); // печалба 60
  const costs = [cost(140, 'week', '2026-01-01', { category: 'rent' }), cost(10, 'day', '2026-01-01', { perWorkDay: true, category: 'dispatch' }), cost(200, 'once', '2026-09-15', { category: 'repair' })];
  const data = mk([A, B], costs);
  near('Смяна А: 100 − 30/2 = 85 (ремонтът не се брои на смяна)', shiftNetAfterFixed(data, A), 85);
  near('Смяна Б: 60 − 30/2 = 45', shiftNetAfterFixed(data, B), 45);
  // за деня: приход 170, разходи 10, постоянни 30 + ремонт 200 = 230 → чисто −70
  const st = periodStats(data, '2026-09-15', '2026-09-15');
  near('Денят: постоянни 20 + 10 + ремонт 200 = 230', st.fixedExp, 230);
  near('Денят: чисто 170 − 10 − 230 = −70', st.net, -70);
  eq('Денят: 2 смени, 1 работен ден', [st.shifts, st.workedDays], [2, 1]);
  near('Ефирът се плаща веднъж за деня, а не за всяка смяна', st.fixedByCat.dispatch, 10);
  // ден без смени: само наемът (ефирът е на работен ден)
  const st2 = periodStats(data, '2026-09-16', '2026-09-16');
  near('Ден без смени: само наем 20 → чисто −20', st2.net, -20);
  eq('Ден без смени: 0 смени', st2.shifts, 0);
});

// =====================================================================
// Общи данни за периодите (днес = 2030 г., т.е. всички постоянни разходи са в миналото)
//  A 31.08 20:00 → 01.09 04:00  кеш 100, 8 ч, 100 км   (принадлежи на 31.08)
//  B 01.09 08:00 → 16:00        кеш 200 + карта 50, гориво 30, 8 ч, 150 км
//  C 07.09 (пн) 10:00 → 20:00   прил. 120 + бакшиш 10, мивка 5, 10 ч, без км
//  D 30.09 22:00 → 01.10 06:00  карта 90, 8 ч, 80 км   (принадлежи на 30.09)
//  E 31.12 18:00 → 01.01 03:00  кеш 300, 9 ч, 120 км   (принадлежи на 31.12.2026)
//  F 01.01.2027 12:00 → 18:00   кеш 60, 6 ч
//  Постоянни: седмичен 70 € = 10 €/ден от 01.01.2026
const A = sh('2026-08-31T20:00', '2026-09-01T04:00', { cash: 100 }, [], [1000, 1100]);
const B = sh('2026-09-01T08:00', '2026-09-01T16:00', { cash: 200, card: 50 }, [{ category: 'fuel', amount: 30, qty: 20, fuelType: 'lpg' }], [1100, 1250]);
const C = sh('2026-09-07T10:00', '2026-09-07T20:00', { app: 120, tips: 10 }, [{ category: 'wash', amount: 5 }], [0, 0]);
const Dd = sh('2026-09-30T22:00', '2026-10-01T06:00', { card: 90 }, [], [1250, 1330]);
const E = sh('2026-12-31T18:00', '2027-01-01T03:00', { cash: 300 }, [], [1330, 1450]);
const F = sh('2027-01-01T12:00', '2027-01-01T18:00', { cash: 60 });
const PD = mk([A, B, C, Dd, E, F], [cost(70, 'week', '2026-01-01', { category: 'rent' })]);

await group('Статистика за период: ден, седмица, месец, година, свой период', () => {
  setNow('2030-01-01T12:00');
  // ---- месец септември: B, C, D
  const s = periodStats(PD, '2026-09-01', '2026-09-30');
  eq('Септември: 3 смени (A е на 31.08, D е на 30.09)', s.shifts, 3);
  near('Септември: приход 250 + 130 + 90 = 470', s.income, 470);
  eq('Септември: кеш/карта/прил./бакшиш', [s.cash, s.card, s.app, s.tips], [200, 140, 120, 10]);
  near('Септември: разходи от смените 30 + 5 = 35', s.varExp, 35);
  near('Септември: постоянни 30 × 10 = 300', s.fixedExp, 300);
